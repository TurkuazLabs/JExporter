# 📄 Dosya Yolu: .github/workflows/extension-api-publish.yml
# 📌 Amac: JExporter public Extension API Maven artifact'ini manuel olarak GitHub Packages'a yayinlamak
# 📌 Modul - YAML
# Version: 2.5.0
# Aciklama: Boundary validator ve Maven verify sonrasi extension API snapshot artifact'ini TurkuazLabs package registry'ye deploy eder
# Bagimli Oldugu Katman: Tool | Service | Model | Config

name: Extension API Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-extension-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate extension boundaries
        run: |
          python tools/validate-extension-boundary.py
          python tools/validate-extension-api.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify Extension API
        run: mvn -B -f extension-api/pom.xml clean verify

      - name: Publish Extension API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -f extension-api/pom.xml
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/TurkuazLabs/JExporter
          deploy
