# 📄 Dosya Yolu: .github/workflows/ci.yml
# 📌 Amac: JExporter Java 17 Maven build dogrulamasini GitHub Actions uzerinde calistirmak
# 📌 Modul - FileType
# Version: 2.5.0
# Aciklama: Extension boundary validator ve Java 17 Maven test/package kontrollerini calistirir
# Bagimli Oldugu Katman: Tool

name: JExporter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Extension Boundaries
        run: |
          python tools/validate-extension-boundary.py
          python tools/validate-extension-api.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Extension API
        run: mvn -B -f extension-api/pom.xml clean verify

      - name: Maven Verify
        run: mvn -B clean verify
